# Private HTTPS front end, run as its own nginx instance by game-manager-proxy.service so it never
# shares a configuration, pid file or failure with an existing nginx. Bind only to the private
# (for example Meshnet) address, never to a public interface or tunnel. A VPN address can appear
# after boot; the unit retries until it can bind. Replace the address, name and certificate paths.
user www-data;
worker_processes 1;
pid /run/game-manager-proxy/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /var/cache/game-manager-proxy/body;
    proxy_temp_path /var/cache/game-manager-proxy/proxy;
    fastcgi_temp_path /var/cache/game-manager-proxy/fastcgi;
    uwsgi_temp_path /var/cache/game-manager-proxy/uwsgi;
    scgi_temp_path /var/cache/game-manager-proxy/scgi;

    server {
        listen 100.116.183.201:8443 ssl;
        server_name panel.example.internal;

        ssl_certificate     /etc/game-manager/tls/panel.crt;
        ssl_certificate_key /etc/game-manager/tls/panel.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # The API enforces its own per-route body limits (16 KiB by default, 1 MiB eggs, 4 MiB
        # text files, 4 GiB uploads, 256 GiB imports); nginx must not cut uploads off first.
        client_max_body_size 0;

        location / {
            proxy_pass http://127.0.0.1:19090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # Uploads, imports and downloads stream through without being buffered on disk first,
        # and may run for a long time on slow links.
        location ~ ^/api/(servers/[^/]+/(files/(upload|download)|import|backups/[^/]+/download)|retained-backups) {
            proxy_pass http://127.0.0.1:19090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
