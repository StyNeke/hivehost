# Private HTTPS front end. Bind only to the private (for example Meshnet) address, never to a
# public interface or tunnel. Replace the address, name and certificate paths.
server {
    listen 100.116.183.201:8443 ssl;
    server_name panel.example.internal;

    ssl_certificate     /etc/game-manager/tls/panel.crt;
    ssl_certificate_key /etc/game-manager/tls/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The API enforces its own per-route body limits (16 KiB by default, 1 MiB eggs, 4 MiB text
    # files, 4 GiB uploads, 256 GiB imports); nginx must not cut uploads off first.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:19090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Uploads, imports and downloads stream through without being buffered on disk first, and may
    # run for a long time on slow links.
    location ~ ^/api/(servers/[^/]+/(files/(upload|download)|import|backups/[^/]+/download)|retained-backups) {
        proxy_pass http://127.0.0.1:19090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
