[package]
name = "manager-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
manager-core = { path = "../core" }
manager-protocol = { path = "../protocol" }
rusqlite.workspace = true
uuid.workspace = true
argon2 = "0.5"
sha2 = "0.10"
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util"] }
serde.workspace = true
rpassword = "7"
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
