[package]
name = "manager-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
manager-protocol = { path = "../protocol" }
manager-core = { path = "../core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync", "process", "fs"] }
serde = { workspace = true }
serde_json = "1"
uuid.workspace = true
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
libc = "0.2"
tempfile.workspace = true
